[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-multi-review"
version = "0.1.0"
description = "Custom Agent based multi-review toolkit for VS Code GitHub Copilot Chat."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "copilot-multi-review contributors" }]
dependencies = [
  "PyYAML>=6",
  "openpyxl>=3.1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ai-review = "ai_review.cli:main"
copilot-multi-review = "ai_review.setup_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_review*"]

[tool.setuptools.package-data]
ai_review = [
  "agent_templates/*.agent.md",
  "antigravity_plugin/plugin.json",
  "antigravity_plugin/agents/*.md",
  "antigravity_plugin/skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
