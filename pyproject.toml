[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-multi-review"
version = "0.1.0"
description = "Local multi-agent code review runner for GitHub Copilot CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "copilot-multi-review contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ai-review = "ai_review.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
